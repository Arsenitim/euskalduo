expose_php = Off
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2
memory_limit = 256M
upload_max_filesize = 5M
post_max_size = 6M
max_file_uploads = 1
session.use_strict_mode = 1
session.use_only_cookies = 1
session.save_path = /tmp
opcache.enable = 1
opcache.validate_timestamps = 0
