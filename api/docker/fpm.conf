[global]
daemonize = no
error_log = /proc/self/fd/2
log_limit = 8192

[www]
listen = 9000
; No per-request access log in PHP-FPM: nginx keeps a minimal log instead.
access.log = /dev/null
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
; Worker count is configurable for small hosts (FPM_MAX_CHILDREN in .env).
pm = ondemand
pm.max_children = ${FPM_MAX_CHILDREN}
pm.process_idle_timeout = 30s
pm.max_requests = 500
