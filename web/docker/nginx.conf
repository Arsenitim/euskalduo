# Minimal access log: no client IP, no user agent, no query string, no referrer.
log_format euskalduo '$time_iso8601 "$request_method $uri" $status $body_bytes_sent';

# Cookie "Secure" flag when a TLS-terminating proxy (e.g. Traefik) is in front.
map $http_x_forwarded_proto $euskalduo_https {
    default "";
    https on;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    access_log /dev/stdout euskalduo;
    client_max_body_size 6m;

    # Behind a reverse proxy (Traefik) use the visitor's address from
    # X-Forwarded-For, trusted only from private networks. The API uses it
    # solely to rate-limit and label feedback; it is not in the access log.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from fc00::/7;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Resolve the API container lazily so nginx starts even if it is not up yet.
    resolver 127.0.0.11 valid=30s ipv6=off;

    include /etc/nginx/security-headers.conf;

    location /api/ {
        set $api_upstream api:9000;
        include fastcgi_params;
        fastcgi_pass $api_upstream;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /app/public;
        fastcgi_param HTTPS $euskalduo_https if_not_empty;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 60s;
    }

    # Uploaded pictures: re-encoded WebP files with random names only.
    location /uploads/ {
        alias /srv/uploads/;
        location ~ "^/uploads/[a-f0-9]{32}\.webp$" {
            types { }
            default_type image/webp;
            include /etc/nginx/security-headers.conf;
            add_header Content-Security-Policy "default-src 'none'; sandbox" always;
            add_header Cache-Control "public, max-age=2592000, immutable" always;
        }
        return 404;
    }

    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Web App Manifest (home-screen install). nginx has no MIME type for it.
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location = /admin {
        return 301 /admin/;
    }

    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
